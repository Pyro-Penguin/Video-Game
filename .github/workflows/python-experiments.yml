name: Python Experiments and Documentation Validation

on:
  push:
    paths:
      - "experiments/**"
      - "tools/**"
      - "docs/**"
      - "COLLABORATION_PROTOCOL.md"
      - "PROJECT_INDEX.md"
      - "PROJECT_STATUS.md"
      - "HANDOFF.md"
      - ".github/workflows/python-experiments.yml"
  pull_request:
    paths:
      - "experiments/**"
      - "tools/**"
      - "docs/**"
      - "COLLABORATION_PROTOCOL.md"
      - "PROJECT_INDEX.md"
      - "PROJECT_STATUS.md"
      - "HANDOFF.md"
      - ".github/workflows/python-experiments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  damage-rng:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run automated tests
        working-directory: experiments/damage_rng
        run: python -m unittest -v
      - name: Generate report smoke test
        working-directory: experiments/damage_rng
        run: |
          python damage_rng.py --trials 1000 --seed 20261030 --output /tmp/damage-rng-report.json
          python -c "import json; p=json.load(open('/tmp/damage-rng-report.json')); assert len(p['models']) == 6; print('JSON report smoke test passed')"

  stat-range-sensitivity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run shared candidate tests
        working-directory: experiments/common
        run: python -m unittest -v
      - name: Run stat-range sensitivity tests
        working-directory: experiments/stat_range_sensitivity
        run: python -m unittest -v
      - name: Generate and validate sensitivity report
        working-directory: experiments/stat_range_sensitivity
        run: |
          python stat_range_sensitivity.py --output /tmp/stat-range-report-v2.json
          python -c "import json; p=json.load(open('/tmp/stat-range-report-v2.json')); c=p['sample_counts']; assert c['all_vs_all_rows'] == len(p['all_vs_all']); assert c['combined_perturbation_rows'] == len(p['combined_perturbations']); assert c['level_rows'] == len(p['level_sweep']); assert c['single_stat_ttk_shift_rows'] == len(p['single_stat_ttk_shifts']); assert len(p['single_stat_ttk_shift_summary']) == 9; print('Single-stat TTK summary:', p['single_stat_ttk_shift_summary']); assert p['raw_vs_floored_rank_audit']['matchup_count'] == 75; assert p['pairwise_rank_flip_audit']['pairwise_comparisons'] == 4125; assert p['candidate_b_cross_matchup_rank_stability']['pair_comparisons_per_offset'] == 2775; print('Expanded stat-range report smoke test passed')"
      - name: Publish stat-range sensitivity report
        uses: actions/upload-artifact@v4
        with:
          name: expanded-damage-sensitivity-report
          path: /tmp/stat-range-report-v2.json
          if-no-files-found: error
          retention-days: 30

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test documentation validator
        working-directory: tools
        run: python -m unittest -v test_validate_docs.py
      - name: Validate project documentation
        working-directory: tools
        run: python validate_docs.py

  battle-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run battle simulation and CLI pipeline tests
        working-directory: experiments/battle_sim
        run: python -m unittest -v
      - name: Run three-battle pipeline validation twice
        working-directory: experiments/battle_sim
        run: |
          python cli_runner.py --battles 3 --offset 100 --output /tmp/pipeline-trace-a.json > /tmp/pipeline-readable-a.txt
          python cli_runner.py --battles 3 --offset 100 --output /tmp/pipeline-trace-b.json > /tmp/pipeline-readable-b.txt
          cmp /tmp/pipeline-trace-a.json /tmp/pipeline-trace-b.json
          cmp /tmp/pipeline-readable-a.txt /tmp/pipeline-readable-b.txt
          python -c "import json; p=json.load(open('/tmp/pipeline-trace-a.json')); assert len(p['battles']) == 3; assert all(b['final_state']['is_finished'] for b in p['battles']); assert all(any(e['event_type'] == 'ReserveDeployed' for t in b['turns'] for e in t['events']) for b in p['battles']); print('Three-battle deterministic pipeline and reserve validation passed')"
      - name: Publish deterministic pipeline trace
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-scaffold-pipeline-trace
          path: /tmp/pipeline-trace-a.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate deterministic scenario trace
        working-directory: experiments/battle_sim
        run: python demo_scenario.py --output /tmp/battle-scenario-trace.json
      - name: Publish deterministic scenario trace
        uses: actions/upload-artifact@v4
        with:
          name: battle-simulation-scenario-trace
          path: /tmp/battle-scenario-trace.json
          if-no-files-found: error
          retention-days: 30

  damage-equation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run equation comparison tests
        working-directory: experiments/damage_equation
        run: python -m unittest -v
      - name: Generate comparison report smoke test
        working-directory: experiments/damage_equation
        run: |
          python damage_equation.py --output /tmp/damage-equation-report.json
          python -c "import json; p=json.load(open('/tmp/damage-equation-report.json')); assert p['sample_count'] == len(p['results']); assert p['status'].startswith('synthetic investigation'); print('Damage equation report smoke test passed')"
